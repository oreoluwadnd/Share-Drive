# Checks every pull request. On main, deploys the web app to Vercel once every check passed.
# The API is deployed by Railway itself from main, with "Wait for CI" on: it waits for this whole
# workflow, Vercel deploy included, to succeed. Setup: docs/deploy.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  api-tests:
    name: API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.4.0  # this action publishes full version tags only, no v10
      - run: uv sync --frozen
      - run: uv run pytest -q

  app-checks:
    name: App typecheck and web build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # Checks that the web app builds. The deployed build uses the real API address from Vercel.
      - run: npx expo export --platform web
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid

  deploy-web:
    name: Deploy web app to Vercel
    needs: [api-tests, app-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-web
    defaults:
      run:
        working-directory: mobile
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check the Vercel settings are in GitHub
        # Runs before checkout, so mobile/ (the job's default directory) does not exist yet.
        working-directory: ${{ github.workspace }}
        run: |
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            test -n "${!name}" || { echo "::error::Add the $name secret (see docs/deploy.md)"; exit 1; }
          done
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npm install --global vercel@66.6.0
      # Pulls the project's settings and Production variables (EXPO_PUBLIC_API_URL), builds here, uploads the result.
      - run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
      - run: vercel build --prod --token="$VERCEL_TOKEN"
      - run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
