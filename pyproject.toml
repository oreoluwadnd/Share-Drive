[project]
name = "fairdrive"
version = "0.1.0"
description = "Context-aware driving scores from phone sensor trips"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
]

[project.scripts]
fairdrive = "fairdrive.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
